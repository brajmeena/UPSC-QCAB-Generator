<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE 2025 Interview Transcript Database</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .interview-page{max-width:1400px;margin:0 auto;padding:24px}
    .interview-hero{margin-bottom:20px}
    .interview-hero h1{margin:0 0 6px}
    .interview-hero p{margin:0;color:var(--muted,#666)}
    .interview-filters{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;margin:20px 0}
    .interview-filter{display:flex;flex-direction:column;gap:6px}
    .interview-filter label{font-weight:600;font-size:.9rem}
    .interview-filter input,.interview-filter select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #d5d9df;border-radius:8px;background:#fff}
    .interview-search{grid-column:span 2}
    .interview-actions{display:flex;gap:10px;align-items:end}
    .interview-actions button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
    #clearInterviewFilters{background:#eef1f5}
    .interview-status{margin:12px 0 18px;font-size:.95rem;color:var(--muted,#666)}
    .interview-results{display:flex;flex-direction:column;gap:14px}
    .interview-card{border:1px solid #dfe3e8;border-radius:12px;background:#fff;overflow:hidden}
    .interview-card summary{list-style:none;cursor:pointer;padding:16px 18px}
    .interview-card summary::-webkit-details-marker{display:none}
    .interview-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .interview-title{font-weight:700;font-size:1.05rem}
    .interview-meta{margin-top:5px;color:#667085;font-size:.9rem}
    .match-badge{white-space:nowrap;background:#fff3bf;border:1px solid #f1df83;border-radius:999px;padding:5px 9px;font-size:.8rem;font-weight:700}
    .interview-body{padding:0 18px 18px;border-top:1px solid #eef0f2}
    .daf-box{margin:16px 0;padding:12px 14px;background:#f7f8fa;border-radius:9px}
    .daf-box strong{display:block;margin-bottom:5px}
    .transcript{display:flex;flex-direction:column;gap:10px}
    .transcript-item{padding:11px 12px;border-left:3px solid #e2e6ea;background:#fafbfc;border-radius:0 7px 7px 0}
    .transcript-speaker{font-weight:700;font-size:.86rem;margin-bottom:4px;color:#495057}
    .transcript-text{line-height:1.55}
    mark.search-highlight{background:#ffe066;border-radius:3px;padding:0 2px}
    .source-row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    .source-row a{font-size:.9rem}
    .empty-state{padding:30px;text-align:center;border:1px dashed #ccd2d9;border-radius:12px;color:#667085}
    .load-error{padding:20px;border:1px solid #f1b0b7;background:#fff5f5;border-radius:10px;color:#842029}
    @media(max-width:900px){
      .interview-filters{grid-template-columns:1fr 1fr}
      .interview-search{grid-column:span 2}
    }
    @media(max-width:600px){
      .interview-page{padding:14px}
      .interview-filters{grid-template-columns:1fr}
      .interview-search{grid-column:span 1}
      .interview-head{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="interview-page">
    <section class="interview-hero">
      <h1>CSE 2025 Interview Transcript Database</h1>
      <p>Search interview transcripts by date, board, DAF and transcript text. Matching terms are highlighted while the complete extracted transcript is shown.</p>
    </section>

    <section class="interview-filters" aria-label="Interview filters">
      <div class="interview-filter">
        <label for="interviewDate">Interview Date</label>
        <select id="interviewDate">
          <option value="">All dates</option>
        </select>
      </div>

      <div class="interview-filter">
        <label for="interviewBoard">Board</label>
        <select id="interviewBoard">
          <option value="">All boards</option>
        </select>
      </div>

      <div class="interview-filter">
        <label for="dafSearch">DAF Search</label>
        <input id="dafSearch" type="search" placeholder="e.g. Jaipur, Geography, IIT Delhi">
      </div>

      <div class="interview-filter interview-search">
        <label for="transcriptSearch">Search Transcript</label>
        <input id="transcriptSearch" type="search" placeholder="e.g. climate change, federalism, Jaipur">
      </div>

      <div class="interview-actions">
        <button id="clearInterviewFilters" type="button">Clear filters</button>
      </div>
    </section>

    <div id="interviewStatus" class="interview-status">Loading database…</div>
    <section id="interviewResults" class="interview-results"></section>
  </main>

  <script src="interview.js"></script>
</body>
</html>
